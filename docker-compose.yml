# Smart Planter — Euregio Hackathon
# Portable: identical stack runs on the devbox (test) and the Raspberry Pi (demo).
# On the Pi just copy this dir and run: docker compose up -d
name: smartplanter

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: planter-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    # Password file is regenerated on every start => idempotent, no manual step.
    # The broker drops privileges to user "mosquitto" after start, so the password
    # file and data dir must be owned by that user or it crash-loops.
    command: >
      sh -c "mkdir -p /mosquitto/data
      && rm -f /mosquitto/data/passwd
      && mosquitto_passwd -b -c /mosquitto/data/passwd $$MQTT_USER $$MQTT_PASSWORD
      && chown -R mosquitto:mosquitto /mosquitto/data
      && chmod 700 /mosquitto/data
      && exec mosquitto -c /mosquitto/config/mosquitto.conf"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u $$MQTT_USER -P $$MQTT_PASSWORD -t '$$SYS/#' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  influxdb:
    image: influxdb:2.7
    container_name: planter-influxdb
    restart: unless-stopped
    ports:
      - "${INFLUX_PORT:-8086}:8086"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-kololab}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-planter}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influx-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  telegraf:
    image: telegraf:1.32-alpine
    container_name: planter-telegraf
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Berlin}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-kololab}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-planter}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  api:
    build: ./api
    container_name: planter-api
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Berlin}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-kololab}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-planter}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      ALERT_DRY_PCT: ${ALERT_DRY_PCT:-25}
      ALERT_DRY_MIN: ${ALERT_DRY_MIN:-20}
      ALERT_SILENT_MIN: ${ALERT_SILENT_MIN:-5}
      ALERT_TANK_PCT: ${ALERT_TANK_PCT:-15}
      PUMP_SECONDS: ${PUMP_SECONDS:-20}
      PUMP_COOLDOWN_MIN: ${PUMP_COOLDOWN_MIN:-30}
      DB_PATH: /data/planter.db
      FLASHER_URL: ${FLASHER_URL:-http://host.docker.internal:6053}
      HOST_HELPER_URL: ${HOST_HELPER_URL:-http://host.docker.internal:6054}
      AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-gemini-2.5-flash}
      HOST_HELPER_TOKEN: ${HOST_HELPER_TOKEN:-}
      NODE_OFFLINE_SEC: ${NODE_OFFLINE_SEC:-90}
      NODES_DIR: /nodes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./esphome:/nodes:ro
    ports:
      - "8097:8000"   # debug only; the web container proxies to :8000 internally
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  web:
    image: nginx:1.27-alpine
    container_name: planter-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "${WEB_PORT:-8098}:80"

  # Grafana was removed on purpose: the dashboard now renders its own graph page
  # straight from InfluxDB (GET /api/history), so the extra container is dead
  # weight. InfluxDB + Telegraf stay — they are the long-term data store.

  # Optional but recommended: edit + OTA-flash the ESP32 from the browser.
  # Reachable at http://<pi>:6052 — no need to plug in USB after the first flash.
  esphome:
    image: esphome/esphome:2025.8.4
    container_name: planter-esphome
    restart: unless-stopped
    network_mode: host          # needed for mDNS discovery + OTA broadcast
    depends_on:
      mosquitto:
        condition: service_started
    environment:
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./esphome:/config
    command: dashboard /config --username ${ADMIN_USER:-admin} --password ${ADMIN_PASSWORD}
    profiles: ["tools"]          # start with: docker compose --profile tools up -d

  # Detects ESPs plugged into the Pi and flashes them, so the dashboard's
  # "Geräte" panel can flash a new node without SSH. Runs on the host network
  # as root so it can read /dev/ttyUSB*; the API triggers it via
  # POST /api/flash (see docs/DEVICES.md). Phases: spool now, USB passthrough
  # in the Phase F TODO.
  flasher:
    image: esphome/esphome:2025.8.4
    container_name: planter-flasher
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    privileged: true
    volumes:
      - ./esphome:/config
      - ./esphome/.esphome:/config/.esphome
      - ./deploy/flasher.sh:/flasher.sh:ro
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - esphome-cache:/cache
    environment:
      TZ: ${TZ:-Europe/Berlin}
      PLATFORMIO_CORE_DIR: /cache/platformio
    entrypoint: ["/bin/bash", "/flasher.sh"]
    profiles: ["tools"]

volumes:
  mqtt-data:
  influx-data:
  esphome-cache:
