# Telegraf: MQTT -> InfluxDB v2. The only writer to Influx, so the schema lives in one place.
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "5s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  topics = ["planter/telemetry"]
  qos = 1
  client_id = "telegraf-planter"
  connection_timeout = "30s"
  data_format = "json"
  name_override = "planter"
  json_time_key = "ts"
  json_time_format = "unix"
  tag_keys = ["device", "fw"]
  # Non-numeric values become string fields so `fault`, `mode` and `pump`
  # stay queryable without breaking the numeric fields. Keep this in sync
  # with the firmware payload: any string-valued key that is not listed
  # here is silently dropped by Telegraf.
  json_string_fields = ["fault", "mode", "pump"]

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
  timeout = "10s"
