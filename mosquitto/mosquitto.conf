# Smart Planter MQTT broker
listener 1883 0.0.0.0

# No anonymous clients: the ESP32 and Telegraf both authenticate.
allow_anonymous false
password_file /mosquitto/data/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Keep the last telemetry message so a restarting API/Telegraf still sees it.
retain_available true
