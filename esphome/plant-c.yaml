# ============================================================================
# Smart Planter / FloraHome — ESP32 node (WROOM DevKit, 30/38-pin)
# ----------------------------------------------------------------------------
# This is the config for the REAL hardware we have:
#   * DHT11 temperature/humidity      GPIO 27
#   * LDR voltage divider (light)     GPIO 35   (replaces the missing BH1750)
#   * HW-390 capacitive soil probe    AOUT GPIO 34, power-gated by GPIO 25
#   * relay module: pump IN1 GPIO 26, grow light IN2 GPIO 13
#   * active buzzer                   GPIO 14
#   * "water now" button              GPIO 4
#   (No JSN-SR04T / tank sensor — the tank feature is removed on purpose.)
#
# Flash once over USB, then OTA:
#   esphome run smartplanter.yaml
#   esphome run smartplanter.yaml --device <ip>
#
# SAFETY: the pump relay is ALWAYS OFF on boot and the maximum run time is
# enforced HERE, in firmware. If the Pi dies mid-watering the relay still opens.
#
# PUMP: the R385 is a 12 V diaphragm pump. The relay switches its OWN 12 V feed.
# 12 V feeds the pump + grow light only. Logic is a separate 5 V rail.
# ============================================================================

substitutions:
  device_name: plant-c
  friendly_name: "Pflanze C"
  fw_version: "1.2.0"

  # --- MQTT broker ---------------------------------------------------------
  # The node joins the Pi's own hotspot (SSID FloraHome, 10.42.0.0/24); the Pi
  # is 10.42.0.1 there and owns the broker. Same L2 => OTA works.
  mqtt_broker: "10.42.0.1"

  # --- Soil calibration (HW-390 capacitive) --------------------------------
  # moisture_pct = (dry_v - measured_v) / (dry_v - wet_v) * 100
  # Probe in AIR -> dry_v (capacitive usually ~2.2-2.6 V)
  # Probe in TAP WATER -> wet_v (~1.1-1.5 V). Measure, do not guess.
  soil_dry_v: "2.50"
  soil_wet_v: "1.20"

  # --- Safety limits -------------------------------------------------------
  pump_max_seconds: "45"      # hard ceiling, cannot be exceeded by any command
  moisture_cycle: "30s"       # how often the soil probe is powered + sampled

  # --- Wiring (ESP32 GPIO numbers) -----------------------------------------
  pin_soil_adc: "34"          # HW-390 AOUT. MUST be an ADC1 pin (32-39)
  pin_soil_power: "25"        # probe powered only while sampling (anti-corrosion)
  pin_dht: "27"               # DHT11 data (10k pull-up to 3.3V if needed)
  pin_ldr: "35"               # LDR divider midpoint (ADC1, input-only)
  pin_relay_pump: "26"        # relay IN1 (pump)
  pin_relay_light: "13"       # relay IN2 (grow light)
  pin_buzzer: "14"            # buzzer
  pin_button: "4"             # tactile button to GND (water now)

  # Relay modules are usually ACTIVE LOW. If the pump runs when it should be
  # idle, flip this to "true".
  relay_inverted: "false"

globals:
  - id: halted
    type: bool
    restore_value: no
    initial_value: "false"
  # Soil calibration, runtime-adjustable over MQTT and persisted across reboots.
  # Send: {"action":"cal","soil_dry_v":X,"soil_wet_v":Y} to planter/cmd
  - id: soil_dry
    type: float
    restore_value: yes
    initial_value: "${soil_dry_v}"
  - id: soil_wet
    type: float
    restore_value: yes
    initial_value: "${soil_wet_v}"

esphome:
  name: ${device_name}
  friendly_name: "Pflanze C"
  min_version: "2025.8.0"
  on_boot:
    priority: 800
    then:
      - switch.turn_off: pump_relay
      - switch.turn_off: light_relay
      - switch.turn_off: buzzer

esp32:
  board: esp32dev
  framework:
    type: arduino

# ---------------------------------------------------------------- connectivity
logger:
  level: INFO

api:
  # We talk to the node over MQTT, never over the ESPHome native API. Leaving the
  # default reboot_timeout made the node reboot every 15 min when no API client
  # connected — one of the causes of the "randomly offline" nodes. Disable it.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Reconnect aggressively if the AP drops us; this is a demo hotspot on the Pi.
  power_save_mode: NONE
  fast_connect: false
  reboot_timeout: 15min
  ap:
    ssid: "${device_name} fallback"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  version: 3

time:
  - platform: sntp
    id: esptime
    timezone: Europe/Berlin
    servers: [0.pool.ntp.org, 1.pool.ntp.org]

# ------------------------------------------------------------------------ MQTT
mqtt:
  broker: ${mqtt_broker}
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  client_id: ${device_name}
  topic_prefix: planter/${device_name}
  discovery: false
  # Keep the broker session alive across a brief Wi-Fi blip and reconnect cleanly.
  keepalive: 30s
  reboot_timeout: 15min
  birth_message:
    topic: planter/${device_name}/status
    payload: online
  will_message:
    topic: planter/${device_name}/status
    payload: offline
  on_json_message:
    - topic: planter/${device_name}/cmd
      then:
        - lambda: |-
            if (id(halted)) {
              ESP_LOGW("planter", "NOT-AUS active - command ignored");
              return;
            }
            std::string action = x["action"] | "";
            if (action == "pump") {
              int secs = x["seconds"] | 20;
              if (secs < 1)  secs = 1;
              if (secs > ${pump_max_seconds}) secs = ${pump_max_seconds};
              ESP_LOGI("planter", "manual/auto pump %ds", secs);
              id(pump_dose)->execute(secs);
            } else if (action == "stop") {
              id(pump_dose)->stop();
              id(pump_relay).turn_off();
            } else if (action == "light") {
              std::string st = x["state"] | "off";
              if (st == "on") id(light_relay).turn_on(); else id(light_relay).turn_off();
            } else if (action == "buzzer") {
              int secs = x["seconds"] | 3;
              id(beep)->execute(secs);
            } else if (action == "cal") {
              float dv = x["soil_dry_v"] | NAN;
              float wv = x["soil_wet_v"] | NAN;
              if (!isnan(dv)) id(soil_dry) = dv;
              if (!isnan(wv)) id(soil_wet) = wv;
              ESP_LOGI("planter", "cal set: dry=%.3f wet=%.3f", id(soil_dry), id(soil_wet));
            } else {
              ESP_LOGW("planter", "unknown action: %s", action.c_str());
            }
    - topic: planter/${device_name}/estop
      then:
        - lambda: |-
            bool stop_all = x["estop"] | false;
            id(halted) = stop_all;
            if (stop_all) {
              id(pump_dose)->stop();
              id(beep)->stop();
              id(pump_relay).turn_off();
              id(light_relay).turn_off();
              id(buzzer).turn_off();
              ESP_LOGW("planter", "NOT-AUS: all outputs off");
            } else {
              ESP_LOGI("planter", "NOT-AUS cleared");
            }

# ---------------------------------------------------------------------- sensors
sensor:
  # --- soil: raw ADC, sampled only while powered ---------------------------
  - platform: adc
    id: soil_adc
    pin: GPIO${pin_soil_adc}
    attenuation: 11db
    update_interval: 1h          # real sampling driven by the cycle below
    internal: true
    filters:
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 1

  - platform: template
    name: "Bodenfeuchte"
    id: moisture_pct
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: moisture
    state_class: measurement
    update_interval: ${moisture_cycle}
    lambda: |-
      if (isnan(id(soil_adc).state)) return NAN;
      float dry = id(soil_dry);      // runtime-calibratable (see "cal" cmd)
      float wet = id(soil_wet);
      if (dry == wet) return NAN;
      float pct = (dry - id(soil_adc).state) / (dry - wet) * 100.0f;
      if (pct < 0.0f)   pct = 0.0f;
      if (pct > 100.0f) pct = 100.0f;
      return pct;

  - platform: template
    name: "Bodenfeuchte Rohspannung"
    id: moisture_v
    unit_of_measurement: "V"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: ${moisture_cycle}
    lambda: |-
      if (isnan(id(soil_adc).state)) return NAN;
      return id(soil_adc).state;

  # --- DHT11 ---------------------------------------------------------------
  - platform: dht
    pin: GPIO${pin_dht}
    model: DHT11
    temperature:
      name: "Temperatur"
      id: temp_c
      device_class: temperature
      state_class: measurement
      accuracy_decimals: 1
    humidity:
      name: "Luftfeuchte"
      id: humidity
      device_class: humidity
      state_class: measurement
      accuracy_decimals: 0
    update_interval: 30s

  # --- LDR light sensor (replaces BH1750) ----------------------------------
  # LDR from 3.3V to the node, 10k from node to GND. Bright -> more voltage.
  - platform: adc
    id: lux_adc
    pin: GPIO${pin_ldr}
    attenuation: 11db
    update_interval: 30s
    internal: true
    filters:
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 1

  - platform: template
    name: "Licht"
    id: lux
    unit_of_measurement: "lx"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 30s
    lambda: |-
      if (isnan(id(lux_adc).state)) return NAN;
      // UNCALIBRATED, relative scale only: 0..3.3V -> 0..10000 "lx".
      float v = id(lux_adc).state;
      if (v < 0.0f) v = 0.0f;
      return v / 3.3f * 10000.0f;

  # --- Wi-Fi signal --------------------------------------------------------
  - platform: wifi_signal
    name: "WLAN-Signal"
    id: rssi
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    id: uptime_s
    internal: true

# --------------------------------------------------------------------- switches
switch:
  - platform: gpio
    id: soil_power
    pin: GPIO${pin_soil_power}
    restore_mode: ALWAYS_OFF
    internal: true

  - platform: gpio
    id: pump_relay
    name: "Pumpe"
    pin:
      number: GPIO${pin_relay_pump}
      inverted: ${relay_inverted}
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - logger.log: "pump relay OFF"

  - platform: gpio
    id: light_relay
    name: "Grow Light"
    pin:
      number: GPIO${pin_relay_light}
      inverted: ${relay_inverted}
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: buzzer
    name: "Buzzer"
    pin: GPIO${pin_buzzer}
    restore_mode: ALWAYS_OFF

# ----------------------------------------------------------------------- scripts
script:
  - id: pump_dose
    mode: single
    parameters:
      secs: int
    then:
      - switch.turn_on: pump_relay
      - delay: !lambda "return secs * 1000;"
      - switch.turn_off: pump_relay

  - id: beep
    mode: single
    parameters:
      secs: int
    then:
      - switch.turn_on: buzzer
      - delay: !lambda "return secs * 1000;"
      - switch.turn_off: buzzer

# ------------------------------------------------------------------ binary sensor
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO${pin_button}
      mode: INPUT_PULLUP
      inverted: true
    name: "Taste Wasser jetzt"
    id: button_water
    filters:
      - delayed_on: 30ms
    on_press:
      then:
        - script.execute:
            id: pump_dose
            secs: 15
        - script.execute:
            id: beep
            secs: 1
        - mqtt.publish_json:
            topic: planter/${device_name}/event
            payload: !lambda |-
              root["event"] = "button_water_now";

  - platform: status
    name: "Status"

# -------------------------------------------------------------------- telemetry
interval:
  - interval: 10s
    then:
      - mqtt.publish_json:
          topic: planter/${device_name}/telemetry
          payload: !lambda |-
            root["device"] = "${device_name}";
            root["fw"] = "${fw_version}";
            if (id(esptime).now().is_valid()) root["ts"] = id(esptime).now().timestamp;

            if (!isnan(id(moisture_pct).state)) root["moisture_pct"] = roundf(id(moisture_pct).state * 10) / 10.0f;
            if (!isnan(id(temp_c).state))       root["temp_c"]      = roundf(id(temp_c).state * 10) / 10.0f;
            if (!isnan(id(humidity).state))     root["humidity"]    = roundf(id(humidity).state);
            if (!isnan(id(lux).state))          root["lux"]         = roundf(id(lux).state);
            if (!isnan(id(rssi).state))         root["rssi"]        = roundf(id(rssi).state);
            // raw ADC voltages for calibration / diagnostics
            if (!isnan(id(soil_adc).state))     root["soil_v"]      = roundf(id(soil_adc).state * 1000) / 1000.0f;
            if (!isnan(id(lux_adc).state))      root["ldr_v"]       = roundf(id(lux_adc).state * 1000) / 1000.0f;
            root["cal_dry"] = roundf(id(soil_dry) * 1000) / 1000.0f;
            root["cal_wet"] = roundf(id(soil_wet) * 1000) / 1000.0f;

            root["pump"]  = id(pump_relay).state ? "watering" : "idle";
            root["light"] = id(light_relay).state ? "on" : "off";
            root["mode"]  = "auto";
            root["on_s"]  = (int) id(uptime_s).state;

            std::string fault = "";
            if (isnan(id(moisture_pct).state)) fault += "soil ";
            if (isnan(id(temp_c).state))       fault += "dht11 ";
            if (isnan(id(lux).state))          fault += "ldr ";
            for (auto &c : fault) if (c == ' ') c = ',';
            if (fault.length()) fault.pop_back();   // drop the trailing comma
            root["fault"] = fault.length() ? fault : "ok";

  - interval: ${moisture_cycle}
    then:
      - switch.turn_on: soil_power
      - delay: 2s
      - component.update: soil_adc
      - component.update: moisture_v
      - delay: 1s
      - switch.turn_off: soil_power

# ---------------------------------------------------------------------- buttons
button:
  - platform: restart
    name: "Neustart"
